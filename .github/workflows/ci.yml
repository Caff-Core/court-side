name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, migrate, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: court_side
          POSTGRES_PASSWORD: court_side
          POSTGRES_DB: court_side
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U court_side -d court_side"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://court_side:court_side@localhost:5432/court_side
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Apply migrations and seed fictional data
        run: bun run db:seed

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
